<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texnik tanaffus</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 500px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: spin 4s linear infinite;
            display: inline-block;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #38bdf8;
        }
        p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .footer {
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 1rem;
        }
        .footer strong {
            color: #38bdf8;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚙️</div>
        
        <h1>Texnik tanaffus</h1>
        <p>Saytda profilaktika va yangilanish ishlari olib borilmoqda. Tez orada qaytamiz. Noqulayliklar uchun uzr so'raymiz!</p>
        
        <div class="footer">
            Dasturchi: <strong>Abdulloh</strong>
        </div>
    </div>

</body>
</html>
