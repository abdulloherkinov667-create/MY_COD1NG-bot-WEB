<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Run | TMA Edition</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --neon: #a361ff;
      --neon-green: #00f5a0;
      --accent: #ff3c6f;
      --bg-dark: #0a0a0f;
      --panel-bg: rgba(22, 22, 34, 0.85);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: #030305;
      color: #fff;
      font-family: 'Exo 2', sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 410px;
      height: 100vh;
      max-height: 840px;
      background: var(--bg-dark);
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      border-radius: 0;
    }

    @media (min-width: 480px) {
      .app-container {
        border-radius: 32px;
        border: 4px solid #1a1a26;
        height: 92vh;
      }
    }

    #map {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }

    /* ===== DARK MAP STYLE (Google Maps Dark uslubi) ===== */
    .leaflet-tile-container img {
      filter:
        brightness(0.38)
        contrast(1.25)
        saturate(0.35)
        hue-rotate(195deg);
    }

    /* Ko'k rang yo'llarni kulrang/oq-kulrang qilish */
    .leaflet-layer {
      mix-blend-mode: normal;
    }

    /* Leaflet popup & attribution yashirish */
    .leaflet-control-attribution { display: none !important; }

    /* ===== ZOOM BUTTONS (top-right, rasmdagidek) ===== */
    .zoom-controls {
      position: absolute;
      top: 90px;
      right: 14px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .zoom-btn {
      width: 36px; height: 36px;
      background: rgba(18, 18, 30, 0.92);
      border: 1px solid rgba(163,97,255,0.25);
      color: #ccc;
      font-size: 20px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s;
      user-select: none;
    }
    .zoom-btn:active { background: rgba(163,97,255,0.2); }

    /* Compass (rasmdagi kabi) */
    .compass-btn {
      width: 36px; height: 36px;
      background: rgba(18, 18, 30, 0.92);
      border: 1px solid rgba(163,97,255,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      margin-bottom: 2px;
    }
    .compass-icon {
      width: 18px; height: 18px;
    }

    /* ===== USER LOCATION BUTTON ===== */
    .locate-btn {
      position: absolute;
      top: 90px;
      right: 14px;
      width: 36px; height: 36px;
      background: rgba(18,18,30,0.92);
      border: 1px solid rgba(163,97,255,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    /* ===== TOP STATS ===== */
    .top-stats {
      position: absolute; top: 16px; left: 4%; width: 92%; z-index: 10;
      background: var(--panel-bg);
      border: 1px solid rgba(163, 97, 255, 0.2);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 16px; padding: 12px 4px;
      display: grid; grid-template-columns: repeat(4, 1fr);
      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .stat-box { display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); }
    .stat-box:last-child { border: none; }
    .stat-val { font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 900; color: #fff; }
    .stat-val.neon-text { color: var(--neon-green); text-shadow: 0 0 8px rgba(0,245,160,0.4); }
    .stat-lbl { font-size: 8px; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-top: 4px; font-weight: 700; }

    /* ===== NOTIFICATIONS ===== */
    #notif-container {
      position: absolute; top: 90px; left: 4%; width: 82%; z-index: 10;
      display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    }
    .toast {
      background: rgba(163, 97, 255, 0.15);
      border: 1px solid var(--neon);
      color: #fff; padding: 8px 12px; border-radius: 10px;
      font-size: 11px; font-weight: 600; text-align: center;
      backdrop-filter: blur(8px);
      animation: slideIn 0.3s ease forwards, fadeOut 0.3s ease linear 2.5s forwards;
    }

    /* ===== BOTTOM HUD ===== */
    .bottom-controls {
      position: absolute; bottom: 20px; left: 4%; width: 92%; z-index: 10;
      display: flex; flex-direction: column; gap: 10px;
    }
    .level-bar-wp {
      background: var(--panel-bg); padding: 8px 12px; border-radius: 12px;
      border: 1px solid rgba(163, 97, 255, 0.15); backdrop-filter: blur(8px);
      display: flex; align-items: center; gap: 8px;
    }
    .lvl-txt { font-family: 'Orbitron', monospace; font-size: 10px; color: var(--neon); font-weight: 900; }
    .bar-bg { flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .bar-fill { width: 15%; height: 100%; background: linear-gradient(90deg, var(--neon), var(--neon-green)); transition: width 0.4s; }

    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1; padding: 14px; border-radius: 14px; border: none;
      font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 900;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-start { background: linear-gradient(135deg, var(--neon), #813ce3); color: #fff; box-shadow: 0 4px 15px rgba(163,61,227,0.3); }
    .btn-stop { background: linear-gradient(135deg, var(--accent), #e62253); color: #fff; display: none; }
    .btn-mode {
      background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.1); max-width: 65px;
      font-size: 9px; padding: 0;
    }

    /* ===== SUMMARY ===== */
    #summary-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; background: rgba(18, 18, 26, 0.98);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center;
    }
    .sum-card {
      background: linear-gradient(145deg, rgba(163,97,255,0.05), rgba(18,18,26,0.5));
      border: 1px solid rgba(163,97,255,0.2); padding: 25px 15px; border-radius: 24px;
      width: 100%; max-width: 320px;
    }
    .sum-title { font-family: 'Orbitron', monospace; font-size: 16px; color: var(--neon); margin-bottom: 20px; }
    .sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .sum-box { background: rgba(255,255,255,0.02); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); }
    .sum-val { font-family: 'Orbitron', monospace; font-size: 18px; font-weight: 900; }
    .sum-lbl { font-size: 9px; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-top: 2px; }

    /* ===== USER MARKER (oq dot + binafsha ring, rasmdagidek) ===== */
    .user-dot-wrapper {
      position: relative;
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .user-dot-outer {
      position: absolute;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(100, 120, 255, 0.18);
      animation: ripple 2s infinite;
    }
    .user-dot-inner {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid #5b8aff;
      box-shadow: 0 0 0 2px rgba(91,138,255,0.35), 0 2px 8px rgba(0,0,0,0.5);
      z-index: 1;
    }

    @keyframes ripple {
      0% { transform: scale(0.7); opacity: 0.6; }
      70% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(0.7); opacity: 0; }
    }
    @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-5px); } }
  </style>
</head>
<body>
  <div class="app-container">

    <div id="map"></div>

    <!-- TOP STATS -->
    <div class="top-stats">
      <div class="stat-box"><span class="stat-val neon-text" id="m-time">00:00</span><span class="stat-lbl">Vaqt</span></div>
      <div class="stat-box"><span class="stat-val" id="m-dist">0.00</span><span class="stat-lbl">Masofa KM</span></div>
      <div class="stat-box"><span class="stat-val" id="m-speed">0.0</span><span class="stat-lbl">Tezlik</span></div>
      <div class="stat-box"><span class="stat-val" id="m-kcal">0</span><span class="stat-lbl">Kcal</span></div>
    </div>

    <!-- NOTIFICATIONS -->
    <div id="notif-container"></div>

    <!-- ZOOM + COMPASS CONTROLS (right side, rasmdagidek) -->
    <div class="zoom-controls">
      <div class="compass-btn" onclick="resetBearing()">
        <svg class="compass-icon" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#a361ff" stroke-width="1.5"/>
          <path d="M12 4 L14 11 L12 14 L10 11 Z" fill="#5b8aff"/>
          <path d="M12 20 L14 13 L12 14 L10 13 Z" fill="#555"/>
        </svg>
      </div>
      <div class="zoom-btn" onclick="map.zoomIn()">+</div>
      <div class="zoom-btn" onclick="map.zoomOut()">−</div>
    </div>

    <!-- BOTTOM HUD -->
    <div class="bottom-controls">
      <div class="level-bar-wp">
        <span class="lvl-txt" id="m-lvl">LVL 1</span>
        <div class="bar-bg"><div class="bar-fill" id="m-xp-bar"></div></div>
        <span class="lvl-txt" id="m-xp-lbl">0/100 XP</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-mode" id="btn-mode" onclick="toggleMode()">TEST</button>
        <button class="btn btn-start" id="btn-start" onclick="startWorkout()">BOSHLASH</button>
        <button class="btn btn-stop" id="btn-stop" onclick="stopWorkout()">YAKUNLASH</button>
      </div>
    </div>

    <!-- SUMMARY SCREEN -->
    <div id="summary-screen">
      <div class="sum-card">
        <h2 class="sum-title">MASHG'ULOT YAKUNLANDI</h2>
        <div class="sum-grid">
          <div class="sum-box"><div class="sum-val" id="s-dist">0.00</div><div class="sum-lbl">Masofa (KM)</div></div>
          <div class="sum-box"><div class="sum-val" id="s-time">00:00</div><div class="sum-lbl">Vaqt</div></div>
          <div class="sum-box"><div class="sum-val" id="s-speed">0.0</div><div class="sum-lbl">O'rtacha</div></div>
          <div class="sum-box"><div class="sum-val" id="s-kcal">0</div><div class="sum-lbl">Kaloriya</div></div>
        </div>
        <button class="btn btn-start" style="width:100%;" onclick="closeSummary()">YOPISH</button>
      </div>
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let map, userMarker, trailLine;
    let isRunning = false, isSimulationMode = true;
    let timerInterval, gpsWatchId, simInterval;
    let secondsElapsed = 0, totalDistance = 0, currentSpeed = 0, totalKcal = 0;
    let coordinatesPath = [];
    let currentXp = 0, currentLvl = 1, xpToNextLevel = 100;
    let gameZones = [];
    const voice = window.speechSynthesis;

    // ===== USER MARKER HTML (Google Maps dark uslubi) =====
    const userDotIcon = L.divIcon({
      className: '',
      html: `<div class="user-dot-wrapper">
               <div class="user-dot-outer"></div>
               <div class="user-dot-inner"></div>
             </div>`,
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    function initMap() {
      const defaultLat = 41.3005;
      const defaultLng = 69.2155;

      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([defaultLat, defaultLng], 17);

      // ===== DARK TILE (CartoDB Dark Matter - Google Maps dark ko'rinishiga eng yaqin) =====
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 20,
        subdomains: 'abcd'
      }).addTo(map);

      userMarker = L.marker([defaultLat, defaultLng], { icon: userDotIcon }).addTo(map);
      trailLine = L.polyline([], { color: '#a361ff', weight: 4, opacity: 0.9, lineCap: 'round' }).addTo(map);

      // Real GPS joylashuv
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            map.setView([lat, lng], 17);
            userMarker.setLatLng([lat, lng]);
            generateGameZones(lat, lng);
            showNotification("Joylashuv aniqlandi! 📍");
          },
          () => {
            generateGameZones(defaultLat, defaultLng);
            showNotification("GPS ruxsati berilmadi 📡");
          },
          { enableHighAccuracy: true, timeout: 6000 }
        );
      } else {
        generateGameZones(defaultLat, defaultLng);
      }
    }

    function resetBearing() { map.setBearing ? map.setBearing(0) : null; }

    function toggleMode() {
      if (isRunning) return;
      isSimulationMode = !isSimulationMode;
      document.getElementById('btn-mode').textContent = isSimulationMode ? "TEST" : "GPS";
      showNotification(isSimulationMode ? "Simulyatsiya rejimi ⚙️" : "GPS rejimi faol 📡");
    }

    function startWorkout() {
      if (isRunning) return;
      isRunning = true;
      secondsElapsed = 0; totalDistance = 0; totalKcal = 0;
      coordinatesPath = []; trailLine.setLatLngs([]);

      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'flex';

      speak("Started");
      showNotification("Yugurish boshlandi! 🚀");

      timerInterval = setInterval(() => {
        secondsElapsed++;
        document.getElementById('m-time').textContent = formatTime(secondsElapsed);
        if (currentSpeed > 2) {
          totalKcal += (0.012 * currentSpeed);
          document.getElementById('m-kcal').textContent = Math.round(totalKcal);
        }
      }, 1000);

      if (isSimulationMode) {
        const center = userMarker.getLatLng();
        let simLat = center.lat, simLng = center.lng;
        currentSpeed = 12.2;
        simInterval = setInterval(() => {
          simLat += (Math.random() - 0.4) * 0.00012;
          simLng += (Math.random() - 0.3) * 0.00012;
          handleLocationUpdate(simLat, simLng);
        }, 1000);
      } else {
        gpsWatchId = navigator.geolocation.watchPosition(p => {
          currentSpeed = p.coords.speed ? (p.coords.speed * 3.6) : 5.5;
          handleLocationUpdate(p.coords.latitude, p.coords.longitude);
        }, null, { enableHighAccuracy: true });
      }
    }

    function handleLocationUpdate(lat, lng) {
      const pos = new L.LatLng(lat, lng);
      map.panTo(pos);
      userMarker.setLatLng(pos);

      if (coordinatesPath.length > 0) {
        const last = coordinatesPath[coordinatesPath.length - 1];
        const dist = map.distance(last, pos) / 1000;
        if (dist > 0.001) {
          totalDistance += dist;
          document.getElementById('m-dist').textContent = totalDistance.toFixed(2);
          document.getElementById('m-speed').textContent = currentSpeed.toFixed(1);
          coordinatesPath.push(pos);
          trailLine.setLatLngs(coordinatesPath);
          checkZones(lat, lng);
        }
      } else {
        coordinatesPath.push(pos);
      }
    }

    function stopWorkout() {
      if (!isRunning) return;
      isRunning = false;
      clearInterval(timerInterval);
      clearInterval(simInterval);
      if (!isSimulationMode) navigator.geolocation.clearWatch(gpsWatchId);

      speak("Completed");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      document.getElementById('s-dist').textContent = totalDistance.toFixed(2);
      document.getElementById('s-time').textContent = formatTime(secondsElapsed);
      document.getElementById('s-speed').textContent = secondsElapsed > 0
        ? (totalDistance / (secondsElapsed / 3600)).toFixed(1) : "0.0";
      document.getElementById('s-kcal').textContent = Math.round(totalKcal);

      gainXp(Math.round(totalDistance * 100));
      document.getElementById('btn-start').style.display = 'flex';
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('summary-screen').style.display = 'flex';
    }

    function closeSummary() { document.getElementById('summary-screen').style.display = 'none'; }

    function generateGameZones(clat, clng) {
      const colors = ['#ffca28', '#ff3c6f', '#00f5a0'];
      for (let i = 0; i < 4; i++) {
        let zlat = clat + (Math.random() - 0.5) * 0.006;
        let zlng = clng + (Math.random() - 0.5) * 0.006;
        let col = colors[i % colors.length];
        let circle = L.circle([zlat, zlng], {
          color: col, fillColor: col, fillOpacity: 0.1, radius: 50, weight: 1.5
        }).addTo(map);
        gameZones.push({ lat: zlat, lng: zlng, layer: circle, active: true, col });
      }
    }

    function checkZones(ulat, ulng) {
      gameZones.forEach(z => {
        if (z.active && map.distance([ulat, ulng], [z.lat, z.lng]) < 50) {
          z.active = false;
          z.layer.setStyle({ fillOpacity: 0.4, weight: 3 });
          showNotification(z.col === '#ff3c6f' ? "Raqib hududi! ⚠️" : "Zona egallandi! 🟢");
          gainXp(40);
          speak("Zone captured");
          if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
      });
    }

    function gainXp(amt) {
      currentXp += amt;
      if (currentXp >= xpToNextLevel) {
        currentXp -= xpToNextLevel; currentLvl++;
        showNotification(`LEVEL UP: LVL ${currentLvl} 🏆`);
      }
      document.getElementById('m-lvl').textContent = `LVL ${currentLvl}`;
      document.getElementById('m-xp-lbl').textContent = `${currentXp}/${xpToNextLevel} XP`;
      document.getElementById('m-xp-bar').style.width = `${(currentXp / xpToNextLevel) * 100}%`;
    }

    function formatTime(s) {
      let m = Math.floor(s / 60), sec = s % 60;
      return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function showNotification(txt) {
      const el = document.createElement('div');
      el.className = 'toast'; el.textContent = txt;
      document.getElementById('notif-container').appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }

    function speak(t) { if (voice) voice.speak(new SpeechSynthesisUtterance(t)); }

    window.onload = initMap;
  </script>
</body>
</html>
