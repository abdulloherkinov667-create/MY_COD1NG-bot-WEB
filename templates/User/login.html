<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#050a0f"/>
  <title>Mycod1ng-run · Kirish</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --neon: #00f5a0;
      --neon2: #00d9f5;
      --accent: #ff3c6f;
      --dark: #050a0f;
      --card: rgba(0,245,160,0.04);
      --glow: 0 0 24px rgba(0,245,160,0.4);
      --glow2: 0 0 24px rgba(0,217,245,0.4);
      --border: rgba(0,245,160,0.14);
      --border2: rgba(0,217,245,0.14);
      --text: #c8fff5;
      --muted: rgba(200,255,240,0.45);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html{font-size:16px;scroll-behavior:smooth;}
    body{
      background:var(--dark);
      color:var(--text);
      font-family:"Exo 2",sans-serif;
      min-height:100svh;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }

    /* ── BG CANVAS ── */
    #bg-canvas{
      position:fixed;top:0;left:0;width:100%;height:100%;
      z-index:0;opacity:0.3;pointer-events:none;
    }

    /* ── SCAN LINE ── */
    .scan-line{
      position:fixed;top:0;left:0;right:0;height:2px;
      background:linear-gradient(to right,transparent,var(--neon),transparent);
      animation:scanLine 5s linear infinite;
      opacity:0.35;z-index:5;pointer-events:none;
    }
    @keyframes scanLine{0%{top:-2px;}100%{top:100vh;}}

    /* ── NAV ── */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:100;
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 20px;
      background:linear-gradient(to bottom,rgba(5,10,15,0.97),transparent);
      backdrop-filter:blur(14px);
    }
    .logo{
      font-family:"Orbitron",monospace;
      font-size:1.05rem;font-weight:900;
      color:var(--neon);letter-spacing:1.5px;
      text-shadow:var(--glow);
    }
    .logo span{color:var(--neon2);}

    /* ── MAIN WRAPPER ── */
    main{
      position:relative;z-index:1;
      min-height:100svh;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:100px 20px 60px;
    }

    /* ── LOGIN CARD ── */
    .login-card{
      width:100%;max-width:460px;
      background:rgba(5,12,20,0.88);
      border:1px solid var(--border);
      border-radius:20px;
      padding:40px 32px;
      backdrop-filter:blur(24px);
      box-shadow:0 8px 60px rgba(0,0,0,0.6),inset 0 1px 0 rgba(0,245,160,0.08);
      animation:cardIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
      position:relative;
      overflow:hidden;
    }
    @keyframes cardIn{
      from{opacity:0;transform:translateY(32px) scale(0.97);}
      to{opacity:1;transform:translateY(0) scale(1);}
    }
    .card-top-line{
      position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(to right,transparent,var(--neon),var(--neon2),transparent);
    }

    /* ── CARD HEADER ── */
    .card-header{text-align:center;margin-bottom:32px;}
    .header-badge{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(0,217,245,0.08);
      border:1px solid rgba(0,217,245,0.2);
      color:var(--neon2);font-size:0.62rem;
      letter-spacing:3px;text-transform:uppercase;
      padding:6px 14px;border-radius:20px;margin-bottom:18px;
    }
    .card-title{
      font-family:"Orbitron",monospace;
      font-size:clamp(1.3rem,5vw,1.75rem);
      font-weight:900;line-height:1.15;
      margin-bottom:8px;
    }
    .card-title .t1{
      background:linear-gradient(135deg,#fff 30%,var(--neon2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .card-title .t2{
      background:linear-gradient(135deg,var(--neon),var(--accent));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .card-subtitle{font-size:0.82rem;color:var(--muted);line-height:1.65;}

    /* ── FORM ── */
    .login-form{display:flex;flex-direction:column;gap:20px;}

    .field-group{position:relative;}
    .field-label{
      display:block;
      font-size:0.68rem;letter-spacing:2px;
      text-transform:uppercase;color:var(--muted);
      margin-bottom:8px;font-weight:600;
    }
    .field-wrap{position:relative;}
    .field-icon{
      position:absolute;left:14px;top:50%;transform:translateY(-50%);
      font-size:1rem;pointer-events:none;opacity:0.5;
      transition:opacity 0.2s;
    }
    .field-input{
      width:100%;
      background:rgba(0,245,160,0.03);
      border:1px solid var(--border);
      border-radius:10px;
      padding:14px 14px 14px 44px;
      color:#e0fff5;
      font-family:"Exo 2",sans-serif;font-size:0.9rem;
      transition:all 0.25s;
      outline:none;
      -webkit-appearance:none;
    }
    .field-input::placeholder{color:rgba(200,255,240,0.25);}
    .field-input:focus{
      border-color:var(--neon2);
      background:rgba(0,217,245,0.06);
      box-shadow:0 0 0 3px rgba(0,217,245,0.1);
    }
    .field-input:focus + .field-icon,
    .field-group:focus-within .field-icon{opacity:1;}
    .field-input.has-toggle{padding-right:46px;}

    /* password toggle */
    .pass-toggle{
      position:absolute;right:14px;top:50%;transform:translateY(-50%);
      background:transparent;border:none;
      color:var(--muted);cursor:pointer;
      font-size:1.1rem;padding:4px;
      transition:color 0.2s;
    }
    .pass-toggle:hover{color:var(--neon2);}

    /* options row (remember me & forgot pass) */
    .options-row{
      display:flex;justify-content:between;align-items:center;
      justify-content: space-between;
      font-size:0.78rem;
    }
    .remember-me{
      display:flex;align-items:center;gap:8px;
      color:var(--muted);cursor:pointer;
    }
    .custom-check{
      width:18px;height:18px;flex-shrink:0;
      border:1px solid var(--border);
      border-radius:5px;
      background:rgba(0,245,160,0.03);
      display:flex;align-items:center;justify-content:center;
      transition:all 0.2s;
    }
    .custom-check.checked{
      background:rgba(0,217,245,0.15);
      border-color:var(--neon2);
    }
    .custom-check .checkmark{display:none;color:var(--neon2);font-size:0.7rem;}
    .custom-check.checked .checkmark{display:block;}
    #remember-cb{display:none;}
    
    .forgot-pass{
      color:var(--accent);text-decoration:none;
      border-bottom:1px solid rgba(255,60,111,0.2);
      transition:all 0.2s;
    }
    .forgot-pass:hover{color:#ff6b93;border-color:var(--accent);}

    /* submit button */
    .btn-submit{
      position:relative;overflow:hidden;
      width:100%;
      background:linear-gradient(135deg,var(--neon2),var(--neon));
      color:var(--dark);border:none;
      padding:16px 24px;border-radius:10px;
      font-family:"Orbitron",monospace;
      font-size:0.82rem;font-weight:900;letter-spacing:2px;
      cursor:pointer;text-transform:uppercase;
      min-height:54px;
      box-shadow:0 4px 28px rgba(0,217,245,0.22);
      transition:all 0.25s;
      margin-top:10px;
    }
    .btn-submit:hover{box-shadow:0 4px 40px rgba(0,217,245,0.4);}
    .btn-submit:active{transform:scale(0.98);box-shadow:0 0 50px rgba(0,217,245,0.55);}
    .btn-submit:disabled{opacity:0.45;cursor:not-allowed;box-shadow:none;}
    .btn-submit .btn-shine{
      position:absolute;top:-50%;left:-60%;width:38%;height:200%;
      background:rgba(255,255,255,0.22);transform:skewX(-20deg);
      animation:shineSlide 3s ease-in-out infinite;
    }
    @keyframes shineSlide{0%{left:-60%;}60%,100%{left:120%;}}
    .btn-submit .btn-text{position:relative;z-index:1;}

    /* loading state */
    .btn-submit.loading .btn-text{opacity:0;}
    .btn-submit.loading::after{
      content:'';position:absolute;
      width:22px;height:22px;
      border:3px solid rgba(5,10,15,0.35);
      border-top-color:var(--dark);
      border-radius:50%;
      animation:spin 0.7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── DIVIDER ── */
    .divider{
      display:flex;align-items:center;gap:12px;
      margin:20px 0;
    }
    .divider-line{flex:1;height:1px;background:var(--border);}
    .divider-text{
      font-size:0.65rem;color:var(--muted);
      letter-spacing:2px;text-transform:uppercase;white-space:nowrap;
    }

    /* ── SOCIAL BUTTONS ── */
    .social-grid{display:flex;flex-direction:column;gap:10px;}
    .social-btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;padding:13px 18px;border-radius:10px;
      font-family:"Exo 2",sans-serif;font-size:0.85rem;font-weight:600;
      cursor:pointer;transition:all 0.25s;
      border:1px solid;letter-spacing:0.3px;
      min-height:48px;position:relative;overflow:hidden;
    }
    .social-btn svg{width:20px;height:20px;flex-shrink:0;}
    .social-btn .shine{
      position:absolute;top:-50%;left:-60%;width:35%;height:200%;
      background:rgba(255,255,255,0.08);transform:skewX(-20deg);
      animation:shineSlide 4s ease-in-out infinite;
    }

    .btn-google{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.12);color:#e8eaed;}
    .btn-google:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.25);}
    .btn-telegram{background:rgba(0,136,204,0.1);border-color:rgba(0,136,204,0.3);color:#7dd4f8;}
    .btn-telegram:hover{background:rgba(0,136,204,0.18);border-color:rgba(0,136,204,0.5);}

    /* register link */
    .register-link{
      text-align:center;margin-top:24px;
      font-size:0.8rem;color:var(--muted);
    }
    .register-link a{
      color:var(--neon);text-decoration:none;
      border-bottom:1px solid rgba(0,245,160,0.3);
      font-weight:600;
    }
    .register-link a:hover{color:var(--neon2);}

    /* ── TOAST ── */
    #toast{
      position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);
      background:rgba(5,15,25,0.95);border-radius:12px;padding:14px 22px;
      font-size:0.82rem;color:#e0fff5;display:flex;align-items:center;gap:10px;
      box-shadow:0 8px 40px rgba(0,0,0,0.5);z-index:999;
      transition:transform 0.4s cubic-bezier(0.16,1,0.3,1),opacity 0.4s;opacity:0;white-space:nowrap;
    }
    #toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
    #toast.success{border:1px solid rgba(0,245,160,0.3);}
    #toast.error{border:1px solid rgba(255,60,111,0.3);}
    #toast.info{border:1px solid rgba(0,217,245,0.3);}

    /* ── ERROR LABELS ── */
    .field-error{font-size:0.67rem;color:#ff3c6f;letter-spacing:1px;margin-top:5px;display:none;}
    .field-group.error .field-input{border-color:rgba(255,60,111,0.5);}
    .field-group.error .field-error{display:block;}

    /* Animations */
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    .anim-1{animation:fadeIn 0.5s ease 0.05s both;}
    .anim-2{animation:fadeIn 0.5s ease 0.15s both;}
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="scan-line"></div>

<nav>
  <div class="logo">Mycod1ng<span>-run</span></div>
</nav>

<main>
  <div class="login-card">
    <div class="card-top-line"></div>

    <div class="card-header anim-1">
      <div class="header-badge">🔑 Tizimga Kirish</div>
      <h1 class="card-title">
        <span class="t1">Xush</span>
        <span class="t2"> Kelibsiz.</span>
      </h1>
      <p class="card-subtitle">Profilingizga kiring va hududni himoya qiling.</p>
    </div>

    <form class="login-form anim-2" id="login-form" onsubmit="handleLogin(event)" novalidate>

      <div class="field-group" id="fg-identity">
        <label class="field-label" for="identity">Foydalanuvchi nomi yoki Telefon</label>
        <div class="field-wrap">
          <input class="field-input" type="text" id="identity" name="identity"
            placeholder="sardor_run yoki 901234567" autocomplete="username"
            oninput="clearErr('fg-identity')"/>
          <span class="field-icon">⚡</span>
        </div>
        <span class="field-error" id="err-identity">Foydalanuvchi nomi yoki raqamni kiriting</span>
      </div>

      <div class="field-group" id="fg-password">
        <label class="field-label" for="password">Parol</label>
        <div class="field-wrap">
          <input class="field-input has-toggle" type="password" id="password"
            name="password" placeholder="Sizning maxfiy parolingiz..."
            autocomplete="current-password"
            oninput="clearErr('fg-password')"/>
          <span class="field-icon">🔒</span>
          <button type="button" class="pass-toggle" onclick="togglePass('password',this)"
            aria-label="Parolni ko'rsat">👁️</button>
        </div>
        <span class="field-error" id="err-password">Parol xato yoki bo'sh bo'lishi mumkin emas</span>
      </div>

      <div class="options-row">
        <div class="remember-me" onclick="toggleRemember()">
          <div class="custom-check" id="remember-box" role="checkbox" aria-checked="false" tabindex="0">
            <span class="checkmark">✓</span>
          </div>
          <input type="checkbox" id="remember-cb" name="remember"/>
          <span>Eslab qolish</span>
        </div>
        <a href="#" class="forgot-pass" onclick="showToast('Parolni tiklash tizimi yaqin orada...','info','ℹ️'); return false;">Parolni unutdingizmi?</a>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
          <span class="btn-shine"></span>
          <span class="btn-text">Tizimga Kirish</span>
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">yoki</span>
        <div class="divider-line"></div>
      </div>

      <div class="social-grid">
        <button type="button" class="social-btn btn-google" onclick="socialAuth('Google')">
          <span class="shine"></span>
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google bilan kirish
        </button>

        <button type="button" class="social-btn btn-telegram" onclick="socialAuth('Telegram')">
          <span class="shine"></span>
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02 Gandalf .472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.244-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
          Telegram bilan kirish
        </button>
      </div>
    </form>

    <div class="register-link">
      Yangi foydalanuvchimisiz? <a href="register.html">Ro'yxatdan o'tish</a>
    </div>
  </div>
</main>

<div id="toast"><span class="toast-icon" id="toast-icon">✅</span><span id="toast-msg"></span></div>

<script>
// ══════════════════════════════════════════
//  BACKGROUND PARTICLES (Zarrachalar)
// ══════════════════════════════════════════
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let W, H, pts = [];

function resizeBg(){
  W = bgCanvas.width = window.innerWidth;
  H = bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg, {passive:true});

class Pt{
  constructor(){this.reset();}
  reset(){
    this.x = Math.random()*W; this.y = Math.random()*H;
    this.r = Math.random()*1.3+0.3;
    this.vx = (Math.random()-0.5)*0.3; this.vy = (Math.random()-0.5)*0.3;
    this.a = Math.random()*0.45+0.08;
    this.c = Math.random()>0.5?'0,245,160':'0,217,245';
  }
  tick(){
    this.x+=this.vx; this.y+=this.vy;
    if(this.x<0||this.x>W||this.y<0||this.y>H) this.reset();
  }
  draw(){
    bgCtx.beginPath();
    bgCtx.arc(this.x,this.y,this.r,0,Math.PI*2);
    bgCtx.fillStyle=`rgba(${this.c},${this.a})`;
    bgCtx.fill();
  }
}

const count = window.innerWidth<480?40:70; // Mobile optimizatsiya
for(let i=0;i<count;i++) pts.push(new Pt());

function animBg(){
  bgCtx.clearRect(0,0,W,H);
  pts.forEach(p=>{p.tick();p.draw();});
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<90){
        bgCtx.beginPath();
        bgCtx.moveTo(pts[i].x,pts[i].y);
        bgCtx.lineTo(pts[j].x,pts[j].y);
        bgCtx.strokeStyle=`rgba(0,217,245,${0.05*(1-d/90)})`;
        bgCtx.lineWidth=0.5;
        bgCtx.stroke();
      }
    }
  }
  requestAnimationFrame(animBg);
}
animBg();

// ══════════════════════════════════════════
//  TOAST SYSTEM
// ══════════════════════════════════════════
let toastTimer;
function showToast(msg, type='success', icon='✅'){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  document.getElementById('toast-icon').textContent=icon;
  t.className='';
  void t.offsetWidth;
  t.className=`show ${type}`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.classList.remove('show');},3200);
}

// ══════════════════════════════════════════
//  PASSWORD TOGGLE
// ══════════════════════════════════════════
function togglePass(id, btn){
  const inp=document.getElementById(id);
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈';}
  else{inp.type='password';btn.textContent='👁️';}
}

// ══════════════════════════════════════════
//  REMEMBER ME CHECKBOX
// ══════════════════════════════════════════
function toggleRemember(){
  const box=document.getElementById('remember-box');
  const cb=document.getElementById('remember-cb');
  box.classList.toggle('checked');
  cb.checked=box.classList.contains('checked');
  box.setAttribute('aria-checked', cb.checked.toString());
}

// ══════════════════════════════════════════
//  SOCIAL AUTH
// ══════════════════════════════════════════
function socialAuth(provider){
  const icons={Google:'🌐',Telegram:'✈️'};
  showToast(`${provider} orqali tizimga kirilmoqda...`,'info', icons[provider]||'🔗');
}

// ══════════════════════════════════════════
//  VALIDATION & SUBMIT
// ══════════════════════════════════════════
function clearErr(id){
  document.getElementById(id).classList.remove('error');
}
function setErr(id, msg){
  const fg=document.getElementById(id);
  fg.classList.add('error');
  const errEl=fg.querySelector('.field-error');
  if(errEl&&msg) errEl.textContent=msg;
  return false;
}

function handleLogin(e){
  e.preventDefault();
  let ok = true;
  
  const identity = document.getElementById('identity').value.trim();
  const pass = document.getElementById('password').value;

  if(!identity) ok = setErr('fg-identity', 'Foydalanuvchi nomi yoki raqam kiritilishi shart');
  if(pass.length < 1) ok = setErr('fg-password', 'Parol bo\'sh bo\'lishi mumkin emas');

  if(!ok) return;

  const btn=document.getElementById('submit-btn');
  btn.classList.add('loading');
  btn.disabled=true;

  // API so'rovini imitatsiya qilish
  setTimeout(()=>{
    btn.classList.remove('loading');
    btn.disabled=false;
    showToast('Tizimga muvaffaqiyatli kirdingiz! 🚀', 'success', '🎯');
  },1500);
}

// Mobile teginish effekti (Ripple)
document.querySelectorAll('.social-btn,.btn-submit').forEach(btn=>{
  btn.addEventListener('touchstart', e=>{
    const rect=btn.getBoundingClientRect();
    const t=e.touches[0];
    const rip=document.createElement('span');
    rip.style.cssText=`position:absolute;border-radius:50%;background:rgba(255,255,255,0.15);
    width:0;height:0;left:${t.clientX-rect.left}px;top:${t.clientY-rect.top}px;
    transform:translate(-50%,-50%);animation:rippleAnim .55s ease-out forwards;pointer-events:none;`;
    btn.style.position='relative';btn.style.overflow='hidden';
    btn.appendChild(rip);
    setTimeout(()=>rip.remove(),600);
  },{passive:true});
});

const rs=document.createElement('style');
rs.textContent='@keyframes rippleAnim{to{width:220px;height:220px;opacity:0;}}';
document.head.appendChild(rs);
</script>
</body>
</html>
